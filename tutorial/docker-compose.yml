services:
  db:
    image: postgres:17-alpine
    container_name: snippets-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - snippets_pgdata:/var/lib/postgresql/data
    networks:
      - snippets-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  snippets-backend:
    build: .
    container_name: snippets-backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - snippets-network
    restart: unless-stopped

networks:
  snippets-network:
    driver: bridge

volumes:
  snippets_pgdata: